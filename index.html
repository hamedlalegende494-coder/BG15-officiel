<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG15 Officiel — Vêtements pour tous</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c2321">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BG15 Officiel">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#c9a227;
    --paper:#0d0d0c;
    --paper-2:#1a1816;
    --brass:#d4af37;
    --brass-dark:#e0c15c;
    --thread:#d9534f;
    --charcoal:#f1ece0;
    --line: rgba(212,175,55,0.18);
    --white:#f3ead9;
    --on-gold:#141208;
    --surface:#161410;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .app{
    background:var(--paper);
    color:var(--charcoal);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 28px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:20;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand img{
    height:44px;
    width:44px;
    border-radius:50%;
    object-fit:cover;
    background:transparent;
  }
  .brand-text{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
    color:var(--ink);
    line-height:1.2;
  }
  .brand-text small{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-weight:400;
    font-size:10px;
    color:var(--brass-dark);
    letter-spacing:1.2px;
    text-transform:uppercase;
    margin-top:2px;
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }
  .cart-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    background:var(--ink);
    color:var(--on-gold);
    border:none;
    padding:9px 14px;
    border-radius:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .cart-btn .count{
    background:var(--brass);
    padding:1px 7px;
    border-radius:10px;
    font-size:11px;
  }
  .mode-toggle{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
  }
  .switch{
    width:44px;height:24px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:20px;
    position:relative;
    cursor:pointer;
    transition:background 0.2s;
  }
  .switch.on{ background:var(--brass); }
  .switch .knob{
    width:18px;height:18px;
    background:var(--white);
    border-radius:50%;
    position:absolute;
    top:2px; left:2px;
    transition:left 0.2s;
    box-shadow:0 1px 2px rgba(0,0,0,0.25);
  }
  .switch.on .knob{ left:22px; }

  .hero{
    padding:44px 28px 28px;
    max-width:1000px;
    margin:0 auto;
  }
  .hero-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--brass-dark);
    margin-bottom:10px;
  }
  .hero h1{
    font-family:'Fraunces', serif;
    font-size:clamp(28px,5vw,48px);
    font-weight:600;
    line-height:1.08;
    margin:0 0 14px;
    color:var(--ink);
  }
  .hero p{
    font-size:15px;
    max-width:520px;
    color:var(--charcoal);
    opacity:0.75;
    line-height:1.5;
    margin:0;
  }

  .wrap{
    max-width:1000px;
    margin:0 auto;
    padding:0 28px;
  }

  /* ---- Admin form ---- */
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
    padding:26px;
    margin-bottom:36px;
  }
  .panel h2{
    font-family:'Fraunces', serif;
    font-size:20px;
    margin:0 0 18px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .panel h2 .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    background:var(--ink);
    color:var(--on-gold);
    padding:3px 8px;
    border-radius:2px;
    letter-spacing:1px;
  }
  label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--brass-dark);
    margin-bottom:6px;
  }
  input[type=text], input[type=number], input[type=tel], textarea{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper);
    color:var(--ink);
    margin-bottom:16px;
  }
  textarea{ resize:vertical; min-height:60px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }

  .img-drop{
    border:1.5px dashed var(--line);
    border-radius:4px;
    padding:18px;
    text-align:center;
    cursor:pointer;
    margin-bottom:16px;
    background:var(--paper);
    transition:border-color 0.15s;
  }
  .img-drop:hover{ border-color:var(--brass); }
  .img-drop img{
    max-height:120px;
    border-radius:3px;
    margin-bottom:8px;
  }
  .img-drop span{
    display:block;
    font-size:12px;
    color:var(--charcoal);
    opacity:0.6;
  }

  .sizes-block{ margin-bottom:16px; }
  .size-row{
    display:grid;
    grid-template-columns:1fr 1fr 34px;
    gap:10px;
    align-items:center;
    margin-bottom:8px;
  }
  .size-row input{ margin-bottom:0; }
  .icon-btn{
    width:34px;height:34px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:3px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--thread);
    font-size:16px;
    line-height:1;
  }
  .icon-btn:hover{ background:#2a1b1a; }
  .add-size-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    background:none;
    border:1px dashed var(--brass);
    color:var(--brass-dark);
    padding:8px 12px;
    border-radius:3px;
    cursor:pointer;
  }
  .add-size-btn:hover{ background:#242018; }

  .btn-primary{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.5px;
    background:var(--ink);
    color:var(--on-gold);
    border:none;
    padding:12px 22px;
    border-radius:3px;
    cursor:pointer;
    margin-top:6px;
  }
  .btn-primary:hover{ background:#000; }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-ghost{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    background:none;
    border:1px solid var(--line);
    color:var(--charcoal);
    padding:9px 16px;
    border-radius:3px;
    cursor:pointer;
    margin-left:10px;
  }

  /* ---- Product grid ---- */
  .section-title{
    font-family:'Fraunces', serif;
    font-size:22px;
    margin:0 0 20px;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:26px;
    margin-bottom:20px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
    overflow:visible;
    position:relative;
    padding-bottom:16px;
  }
  .card .photo{
    width:100%;
    aspect-ratio:3/4;
    height:auto;
    object-fit:cover;
    border-radius:4px 4px 0 0;
    display:block;
    background:var(--paper-2);
  }
  .card .no-photo{
    width:100%;aspect-ratio:3/4;
    display:flex;align-items:center;justify-content:center;
    background:repeating-linear-gradient(135deg, var(--paper-2), var(--paper-2) 8px, #242018 8px, #242018 16px);
    color:var(--charcoal);
    opacity:0.45;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    border-radius:4px 4px 0 0;
  }
  .card-body{ padding:16px 16px 4px; }
  .card-body h3{
    font-family:'Fraunces', serif;
    font-size:17px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .card-body p{
    font-size:13px;
    opacity:0.7;
    margin:0 0 10px;
    line-height:1.4;
  }

  /* signature: hang tag */
  .hangtag{
    position:absolute;
    top:-14px; right:14px;
    background:var(--brass);
    color:var(--on-gold);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:5px 10px 5px 14px;
    border-radius:2px;
    transform:rotate(4deg);
    box-shadow:0 3px 6px rgba(0,0,0,0.2);
  }
  .hangtag::before{
    content:'';
    position:absolute;
    left:5px; top:50%;
    transform:translateY(-50%);
    width:5px;height:5px;
    background:var(--paper);
    border-radius:50%;
  }

  .size-select{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:0 16px;
    margin-bottom:10px;
  }
  .size-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    border:1px solid var(--line);
    padding:5px 10px;
    border-radius:20px;
    cursor:pointer;
    background:var(--paper);
    color:var(--charcoal);
  }
  .size-chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--on-gold);
  }
  .price-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    margin-top:8px;
  }
  .price{
    font-family:'IBM Plex Mono', monospace;
    font-size:18px;
    font-weight:500;
    color:var(--ink);
  }
  .card-actions{
    display:flex;
    gap:8px;
    padding:0 16px;
    margin-top:10px;
  }
  .card-actions button{
    flex:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:8px;
    border-radius:3px;
    cursor:pointer;
  }
  .btn-edit{ background:none; border:1px solid var(--line); color:var(--charcoal); }
  .btn-del{ background:none; border:1px solid var(--thread); color:var(--thread); }
  .btn-add-cart{ background:var(--ink); border:1px solid var(--ink); color:var(--on-gold); }
  .btn-add-cart:hover{ background:#000; }

  .empty{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--charcoal);
    opacity:0.55;
    padding:40px 0;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:4px;
  }

  .shared-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--brass-dark);
    opacity:0.8;
    margin-top:-10px;
    margin-bottom:28px;
  }

  /* ---- Cart view ---- */
  .cart-row{
    display:grid;
    grid-template-columns:1fr auto auto auto;
    gap:14px;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .cart-row .qty-ctrl{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono', monospace;
  }
  .cart-row .qty-ctrl button{
    width:24px;height:24px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:3px;
    cursor:pointer;
  }
  .cart-total{
    display:flex;
    justify-content:space-between;
    padding:18px 0;
    font-family:'Fraunces', serif;
    font-size:20px;
    color:var(--ink);
  }
  .pay-options{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .pay-option{
    flex:1;
    border:1.5px solid var(--line);
    border-radius:4px;
    padding:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .pay-option.active{
    border-color:var(--ink);
    background:var(--paper);
  }
  .pay-option svg{
    flex-shrink:0;
  }
  .pay-logo{
    height:36px;
    width:36px;
    object-fit:contain;
    border-radius:50%;
  }
  .pay-logo-square{
    border-radius:6px;
  }
  .pay-note{
    font-size:12px;
    line-height:1.5;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px;
    margin-bottom:16px;
    color:var(--charcoal);
  }

  .toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--on-gold);
    padding:12px 20px;
    border-radius:4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
  }
  .toast.show{ opacity:1; }

  .order-card{
    border:1px solid var(--line);
    border-radius:4px;
    padding:14px 16px;
    margin-bottom:12px;
    font-size:13px;
  }
  .order-card .oh{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--brass-dark);
    margin-bottom:8px;
  }
  .order-card ul{ margin:0 0 8px; padding-left:18px; }
  .order-card .ot{ font-weight:600; }

  @media (max-width:560px){
    .row2{ grid-template-columns:1fr; }
    .topbar{ padding:12px 16px; }
    .hero{ padding:32px 16px 24px; }
    .wrap{ padding:0 16px; }
    .cart-row{ grid-template-columns:1fr; gap:6px; }
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

  if (!window.storage) {
    const JSONBIN_ID = '6acd8d88ffd5d1605365d899';
    const JSONBIN_KEY = '$2a$10$RDutW.tbUBH/mrgn1P.1V.iqldPVLTkrqcGFa4VoF.7qrCAbBHd62';
    const JSONBIN_URL = 'https://api.jsonbin.io/v3/b/' + JSONBIN_ID;

    window.storage = {
      async get(key){
        const res = await fetch(JSONBIN_URL + '/latest', {
          headers: { 'X-Master-Key': JSONBIN_KEY }
        });
        if (!res.ok) throw new Error('Lecture impossible');
        const data = await res.json();
        const record = data.record || {};
        if (!(key in record)) throw new Error('not found');
        return { key, value: JSON.stringify(record[key]) };
      },
      async set(key, value){
        // lecture puis écriture complète (le bin stocke tout dans un seul document)
        let record = {};
        try{
          const res = await fetch(JSONBIN_URL + '/latest', {
            headers: { 'X-Master-Key': JSONBIN_KEY }
          });
          if (res.ok) {
            const data = await res.json();
            record = data.record || {};
          }
        }catch(e){ /* on repart d'un objet vide si la lecture échoue */ }

        record[key] = JSON.parse(value);

        const putRes = await fetch(JSONBIN_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_KEY
          },
          body: JSON.stringify(record)
        });
        if (!putRes.ok) throw new Error('Sauvegarde impossible');
        return { key, value };
      }
    };

  function compressToDataUrl(file, maxW, quality){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = function(e){
        const img = new Image();
        img.onload = function(){
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadImage(file){
    // Photo nette, redimensionnée raisonnablement pour un envoi rapide,
    // puis hébergée sur ImgBB : seul le lien (très léger) est stocké dans le catalogue.
    const dataUrl = await compressToDataUrl(file, 1000, 0.85);
    const base64 = dataUrl.split(',')[1];
    const formData = new FormData();
    formData.append('key', IMGBB_KEY);
    formData.append('image', base64);

    const res = await fetch('https://api.imgbb.com/1/upload', {
      method: 'POST',
      body: formData
    });
    if (!res.ok) throw new Error('Échec de l\'envoi de l\'image');
    const data = await res.json();
    if (!data.success) throw new Error('Échec de l\'envoi de l\'image');
    return data.data.url;
  }

    const min = Math.min(...nums), max = Math.max(...nums);
    return min===max ? fmtPrice(min) : (fmtPrice(min)+' – '+fmtPrice(max));
  }

    adminPanel.innerHTML = `
      <div class="panel">
        <h2>${isEditing ? 'Modifier le produit' : 'Ajouter un produit'} <span class="tag">${isEditing ? 'édition' : 'nouveau'}</span></h2>
        <label>Photo du produit</label>
        <div class="img-drop" id="imgDrop">
          ${adminPanel._compressing
            ? `<span>⏳ Envoi de la photo en cours...</span>`
            : (draftImage ? `<img src="${draftImage}"/><span>Cliquez pour changer la photo</span>` : `<span>Cliquez pour choisir une image</span>`)
          }
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none">

        <label>Nom du produit</label>
        <input type="text" id="fName" placeholder="Ex. T-shirt col rond">

        <label>Description</label>
        <textarea id="fDesc" placeholder="Matière, coupe, détails..."></textarea>

        <div class="sizes-block">
          <label>Tailles &amp; prix</label>
          <div id="sizeRows"></div>
          <button class="add-size-btn" id="addSizeBtn">+ Ajouter une taille</button>
        </div>

        <button class="btn-primary" id="saveBtn">${isEditing ? 'Enregistrer les modifications' : 'Ajouter au catalogue'}</button>
        ${isEditing ? '<button class="btn-ghost" id="cancelBtn">Annuler</button>' : ''}
      </div>

      <div class="panel">
        <h2>Commandes reçues <span class="tag">${orders.length}</span></h2>
        <div id="ordersList"></div>
      </div>
    `;

    document.getElementById('fName').value = adminPanel._draftName || '';
    document.getElementById('fDesc').value = adminPanel._draftDesc || '';

    document.getElementById('imgDrop').onclick = ()=> document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      adminPanel._compressing = true;
      renderAdminPanel();
      try{
        draftImage = await uploadImage(file);
      }catch(err){
        alert("L'envoi de la photo a échoué. Vérifiez votre connexion internet et réessayez.");
      }
      adminPanel._compressing = false;
      renderAdminPanel();
    };

    document.getElementById('fName').oninput = (e)=> adminPanel._draftName = e.target.value;
    document.getElementById('fDesc').oninput = (e)=> adminPanel._draftDesc = e.target.value;

    document.getElementById('addSizeBtn').onclick = ()=>{
      draftSizes.push({taille:'', prix:''});
      renderSizeRows();
    };

    document.getElementById('saveBtn').onclick = handleSave;
    if(isEditing){
      document.getElementById('cancelBtn').onclick = resetForm;
    }

    renderSizeRows();
    renderOrdersList();
  }

  function renderOrdersList(){
    const el = document.getElementById('ordersList');
    if(!el) return;
    if(!orders.length){
      el.innerHTML = '<div class="empty">Aucune commande reçue pour le moment.</div>';
      return;
    }
    const sorted = [...orders].sort((a,b)=> b.date.localeCompare(a.date));
    el.innerHTML = sorted.map(o=>`
      <div class="order-card">
        <div class="oh"><span>${new Date(o.date).toLocaleString('fr-FR')}</span><span>${escapeHtml(o.nom)} · ${escapeHtml(o.tel)}</span></div>
        <ul>${o.items.map(it=>`<li>${escapeHtml(it.name)} (${escapeHtml(it.taille)}) × ${it.qty} — ${fmtPrice(it.prix*it.qty)}</li>`).join('')}</ul>
        <div class="ot">Total : ${fmtPrice(o.total)} — <span style="color:var(--brass-dark)">${o.payment==='wave'?'Wave':(o.payment==='maxit'?'Max it':'—')}</span></div>
        <button class="btn-ghost" data-order-del="${o.id}" style="margin-left:0;margin-top:8px;">Marquer traitée / supprimer</button>
      </div>
    `).join('');
    el.querySelectorAll('[data-order-del]').forEach(btn=>{
      btn.onclick = async ()=>{
        const backup = orders;
        orders = orders.filter(o=>o.id!==btn.dataset.orderDel);
        try{
          await saveOrders();
        }catch(err){
          orders = backup;
          alert("Erreur de connexion, réessayez.");
        }
        renderOrdersList();
        adminPanel.querySelector('h2 .tag').textContent = orders.length;
      };
    });
  }

  function renderSizeRows(){
    const container = document.getElementById('sizeRows');
    if(!container) return;
    container.innerHTML = draftSizes.map((s,i)=>`
      <div class="size-row">
        <input type="text" placeholder="Taille (S, M, 42...)" value="${s.taille}" data-idx="${i}" data-field="taille">
        <input type="number" step="1" placeholder="Prix F CFA" value="${s.prix}" data-idx="${i}" data-field="prix">
        <button class="icon-btn" data-remove="${i}" title="Supprimer">×</button>
      </div>
    `).join('');

    container.querySelectorAll('input').forEach(inp=>{
      inp.oninput = (e)=>{
        const idx = parseInt(e.target.dataset.idx);
        const field = e.target.dataset.field;
        draftSizes[idx][field] = e.target.value;
      };
    });
    container.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.onclick = (e)=>{
        const idx = parseInt(e.target.dataset.remove);
        draftSizes.splice(idx,1);
        if(draftSizes.length===0) draftSizes.push({taille:'', prix:''});
        renderSizeRows();
      };
    });
  }

  function resetForm(){
    editingId = null;
    draftImage = null;
    draftSizes = [{taille:'', prix:''}];
    adminPanel._draftName = '';
    adminPanel._draftDesc = '';
    adminPanel._compressing = false;
    renderAdminPanel();
  }

  async function handleSave(){
    const name = document.getElementById('fName').value.trim();
    const desc = document.getElementById('fDesc').value.trim();
    const cleanSizes = draftSizes
      .map(s=>({taille:s.taille.trim(), prix:s.prix}))
      .filter(s=>s.taille && s.prix !== '' && !isNaN(parseFloat(s.prix)));

    if(!name){ alert('Merci de donner un nom au produit.'); return; }
    if(!cleanSizes.length){ alert('Ajoutez au moins une taille avec un prix valide.'); return; }

    let addedProduct = null;
    if(editingId){
      const p = products.find(p=>p.id===editingId);
      if(p){
        p.name = name; p.desc = desc; p.sizes = cleanSizes;
        if(draftImage) p.image = draftImage;
      }
    }else{
      addedProduct = { id: uid(), name, desc, image: draftImage, sizes: cleanSizes };
      products.unshift(addedProduct);
    }

    try{
      await saveProducts();
    }catch(err){
      if(addedProduct){ products = products.filter(p=>p !== addedProduct); }
      alert("La sauvegarde en ligne a échoué (souvent parce que la photo est trop lourde). Réessayez avec une photo plus petite, ou vérifiez votre connexion internet.");
      render();
      return;
    }

    resetForm();
    render();
  }

  function startEdit(id){
    const p = products.find(p=>p.id===id);
    if(!p) return;
    editingId = id;
    draftImage = p.image;
    draftSizes = p.sizes.map(s=>({...s}));
    adminPanel._draftName = p.name;
    adminPanel._draftDesc = p.desc;
    renderAdminPanel();
    adminPanel.scrollIntoView({behavior:'smooth'});
  }

  async function deleteProduct(id){
    if(!confirm('Supprimer ce produit du catalogue ?')) return;
    const backup = products;
    products = products.filter(p=>p.id!==id);
    try{
      await saveProducts();
    }catch(err){
      products = backup;
      alert("La suppression n'a pas pu être enregistrée en ligne. Vérifiez votre connexion et réessayez.");
    }
    render();
  }

  // ---------- CATALOG (client + owner shared grid) ----------
  function renderCatalogView(){
    const gridHtml = !products.length
      ? '<div class="empty">Aucun produit pour l\'instant. Passez en mode propriétaire pour en ajouter un.</div>'
      : `<div class="grid">${products.map(cardHtml).join('')}</div>`;

    mainView.innerHTML = `
      <div class="section-title">Catalogue</div>
      <div class="shared-note">Les produits sont visibles par toutes les personnes qui ouvrent cette boutique.</div>
      ${gridHtml}
    `;

    mainView.querySelectorAll('.size-chip').forEach(chip=>{
      chip.onclick = ()=>{
        selectedSize[chip.dataset.pid] = chip.dataset.size;
        renderCatalogView();
      };
    });
    mainView.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.onclick = ()=> startEdit(btn.dataset.edit);
    });
    mainView.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick = ()=> deleteProduct(btn.dataset.del);
    });
    mainView.querySelectorAll('[data-add-cart]').forEach(btn=>{
      btn.onclick = ()=> addToCart(btn.dataset.addCart);
    });
  }

  function cardHtml(p){
    const sel = selectedSize[p.id] || p.sizes[0].taille;
    const activeSize = p.sizes.find(s=>s.taille===sel) || p.sizes[0];
    return `
      <div class="card">
        <div class="hangtag">${p.sizes.length} taille${p.sizes.length>1?'s':''}</div>
        ${p.image ? `<img class="photo" src="${p.image}">` : `<div class="no-photo">Pas de photo</div>`}
        <div class="card-body">
          <h3>${escapeHtml(p.name)}</h3>
          ${p.desc ? `<p>${escapeHtml(p.desc)}</p>` : ''}
        </div>
        <div class="size-select">
          ${p.sizes.map(s=>`<div class="size-chip ${s.taille===sel?'active':''}" data-pid="${p.id}" data-size="${escapeAttr(s.taille)}">${escapeHtml(s.taille)}</div>`).join('')}
        </div>
        <div class="price-line">
          <span class="price">${fmtPrice(activeSize.prix)}</span>
        </div>
        <div class="card-actions">
          ${ownerMode ? `
            <button class="btn-edit" data-edit="${p.id}">Modifier</button>
            <button class="btn-del" data-del="${p.id}">Supprimer</button>
          ` : `
            <button class="btn-add-cart" data-add-cart="${p.id}">Acheter</button>
          `}
        </div>
      </div>`;
  }

  function addToCart(productId){
    const p = products.find(p=>p.id===productId);
    if(!p) return;
    const sel = selectedSize[p.id] || p.sizes[0].taille;
    const sizeObj = p.sizes.find(s=>s.taille===sel) || p.sizes[0];
    const existing = cart.find(i=>i.productId===p.id && i.taille===sizeObj.taille);
    if(existing){ existing.qty += 1; }
    else{
      cart.push({
        productId: p.id, name: p.name, taille: sizeObj.taille,
        prix: sizeObj.prix, qty: 1
      });
    }
    render();
    showToast(`${p.name} (${sizeObj.taille}) ajouté au panier`);
  }

      document.getElementById('backCatalog').onclick = ()=>{ view='catalog'; render(); };

      </div>

    document.getElementById('backCatalog').onclick = ()=>{ view='catalog'; render(); };
    document.getElementById('custName').oninput = (e)=> mainView._name = e.target.value;
    document.getElementById('custPhone').oninput = (e)=> mainView._phone = e.target.value;
    mainView.querySelectorAll('[data-pay]').forEach(el=>{
      el.onclick = ()=>{ mainView._payment = el.dataset.pay; renderCartView(); };
    });
    document.getElementById('validateBtn').onclick = validateOrder;

    renderPayInfo();
    renderCartRows();
  }

  function renderPayInfo(){
    const el = document.getElementById('payInfo');
    if(!el) return;
    if(mainView._payment==='wave'){
      el.innerHTML = `<div class="pay-note">
        Vous allez être redirigé·e vers l'appli <strong>Wave</strong>. Envoyez <strong>${fmtPrice(cartTotal())}</strong> au <strong>${PAYMENT_NUMBER}</strong>, puis revenez ici valider — vous enverrez une preuve de paiement sur WhatsApp.
      </div>`;
    }else if(mainView._payment==='maxit'){
      el.innerHTML = `<div class="pay-note">
        Vous allez être redirigé·e vers l'appli <strong>Max it</strong> (Orange Money). Envoyez <strong>${fmtPrice(cartTotal())}</strong> au <strong>${PAYMENT_NUMBER}</strong>, puis revenez ici valider — vous enverrez une preuve de paiement sur WhatsApp.
      </div>`;
    }else{
      el.innerHTML = '';
    }
  }

  function renderCartRows(){
    const el = document.getElementById('cartRows');
    if(!el) return;
    el.innerHTML = cart.map((item,idx)=>`
      <div class="cart-row">
        <span>${escapeHtml(item.name)} — taille ${escapeHtml(item.taille)}</span>
        <div class="qty-ctrl">
          <button data-dec="${idx}">−</button>
          <span>${item.qty}</span>
          <button data-inc="${idx}">+</button>
        </div>
        <span>${fmtPrice(item.prix*item.qty)}</span>
        <button class="btn-ghost" data-remove-cart="${idx}" style="margin-left:0;">Retirer</button>
      </div>
    `).join('');

    el.querySelectorAll('[data-inc]').forEach(b=> b.onclick = ()=>{
      cart[parseInt(b.dataset.inc)].qty += 1; render();
    });
    el.querySelectorAll('[data-dec]').forEach(b=> b.onclick = ()=>{
      const idx = parseInt(b.dataset.dec);
      cart[idx].qty -= 1;
      if(cart[idx].qty<=0) cart.splice(idx,1);
      render();
    });
    el.querySelectorAll('[data-remove-cart]').forEach(b=> b.onclick = ()=>{
      cart.splice(parseInt(b.dataset.removeCart),1); render();
    });
  }

  async function validateOrder(){
    const nom = (mainView._name||'').trim();
    const tel = (mainView._phone||'').trim();
    const payment = mainView._payment;
    if(!nom || !tel){ alert('Merci de renseigner votre nom et votre téléphone.'); return; }
    if(!cart.length){ alert('Votre panier est vide.'); return; }
    if(!payment){ alert('Merci de choisir un moyen de paiement (Wave ou Max it).'); return; }

    const total = cartTotal();
    const order = {
      id: uid(),
      date: new Date().toISOString(),
      nom, tel,
      payment,
      items: cart.map(i=>({...i})),
      total
    };
    orders.push(order);
    try{
      await saveOrders();
    }catch(err){
      console.error('Enregistrement de la commande échoué', err);
      // on continue quand même : le message WhatsApp reste le canal principal
    }

    const paymentLabel = payment === 'wave' ? 'Wave' : 'Max it';
    let msg = `Nouvelle commande — BG15 Officiel%0A%0A`;
    msg += `Client : ${nom}%0ATéléphone : ${tel}%0A%0A`;
    cart.forEach(i=>{
      msg += `• ${i.name} (${i.taille}) x${i.qty} — ${fmtPrice(i.prix*i.qty)}%0A`;
    });
    msg += `%0ATotal : ${fmtPrice(total)}`;
    msg += `%0APaiement : ${paymentLabel}`;
    msg += `%0A%0A(Preuve de paiement à envoyer ici en pièce jointe 👆)`;

    if(payment === 'wave'){ tryOpenWaveApp(); } else { tryOpenMaxItApp(); }
    setTimeout(()=>{
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, '_blank');
    }, 1500);

    cart = [];
    mainView._payment = null;
    view = 'catalog';
    render();
    showToast('Commande envoyée — merci !');
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  function escapeAttr(str){
    return String(str).replace(/"/g,'&quot;');
  }

  modeSwitch.onclick = async ()=>{
    if(!ownerMode){
      if(!ownerUnlocked){
        const email = prompt('Email propriétaire :');
        if(email === null) return;
        const password = prompt('Mot de passe :');
        if(password === null) return;

        modeSwitch.style.opacity = '0.5';
        try{
          await auth.signInWithEmailAndPassword(email.trim(), password);
          ownerUnlocked = true;
        }catch(err){
          alert('Email ou mot de passe incorrect.');
          modeSwitch.style.opacity = '1';
          return;
        }
        modeSwitch.style.opacity = '1';
      }
      ownerMode = true;
      resetForm();
    }else{
      ownerMode = false;
    }
    render();
  };

  document.getElementById('cartBtn').onclick = ()=>{
    if(ownerMode){ ownerMode = false; }
    view = 'cart';
    render();
  };

  loadProducts();
})();
</script>
